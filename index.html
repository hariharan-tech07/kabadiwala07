<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Mock WebSocket for Vite HMR in cloud preview where HMR is disabled
        if (typeof window !== 'undefined') {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            var MockWebSocket = function(url, protocols) {
              var isViteHmr = false;
              if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1)) {
                isViteHmr = true;
              }
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                isViteHmr = true;
              }
              if (isViteHmr) {
                var dummy = new EventTarget();
                dummy.url = url;
                dummy.readyState = 1; // OPEN
                dummy.CONNECTING = 0;
                dummy.OPEN = 1;
                dummy.CLOSING = 2;
                dummy.CLOSED = 3;
                dummy.binaryType = 'blob';
                dummy.send = function() {};
                dummy.close = function() {
                  dummy.readyState = 3;
                  if (typeof dummy.onclose === 'function') dummy.onclose(new Event('close'));
                  dummy.dispatchEvent(new Event('close'));
                };
                setTimeout(function() {
                  if (typeof dummy.onopen === 'function') dummy.onopen(new Event('open'));
                  dummy.dispatchEvent(new Event('open'));
                }, 0);
                return dummy;
              }
              return new NativeWebSocket(url, protocols);
            };
            MockWebSocket.prototype = NativeWebSocket.prototype;
            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;
            window.WebSocket = MockWebSocket;
          }

          // Prevent unhandled promise rejections or error events from Vite HMR
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = reason ? (reason.message || String(reason)) : '';
            if (msg.indexOf('vite') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite-hmr') !== -1 || msg.indexOf('send was called before connect') !== -1) {
              event.preventDefault();
            }
          });

          // Suppress expected [vite] HMR websocket connection errors in AI Studio cloud iframe
          var origConsoleError = console.error;
          console.error = function() {
            var allArgs = '';
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              if (arg) {
                allArgs += ' ' + (arg.message || arg.stack || (typeof arg === 'object' ? JSON.stringify(arg) : String(arg)));
              }
            }
            if (
              allArgs.indexOf('[vite]') !== -1 ||
              allArgs.indexOf('vite-plugin-pwa') !== -1 ||
              allArgs.indexOf('vite-hmr') !== -1 ||
              allArgs.indexOf('failed to connect to websocket') !== -1 ||
              allArgs.indexOf('send was called before connect') !== -1
            ) {
              return;
            }
            return origConsoleError.apply(console, arguments);
          };

          var origConsoleWarn = console.warn;
          console.warn = function() {
            var allArgs = '';
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              if (arg) {
                allArgs += ' ' + (arg.message || arg.stack || (typeof arg === 'object' ? JSON.stringify(arg) : String(arg)));
              }
            }
            if (
              allArgs.indexOf('[vite]') !== -1 ||
              allArgs.indexOf('vite-plugin-pwa') !== -1 ||
              allArgs.indexOf('vite-hmr') !== -1 ||
              allArgs.indexOf('send was called before connect') !== -1
            ) {
              return;
            }
            return origConsoleWarn.apply(console, arguments);
          };
        }
      })();
    </script>
